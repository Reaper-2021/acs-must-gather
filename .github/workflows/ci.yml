name: CI

# Delegates to the Makefile targets (`make lint`, `make test`, `make test-shell`,
# `make test-integration`, `make check-bundles`) so the checks run identically
# here and on a contributor's machine -- the Makefile stays the single source of
# truth for what "green" means.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: lint (shellcheck + analyzer compile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # shellcheck ships preinstalled on ubuntu-latest and reads .shellcheckrc
      # from the repo root (source-path + disabled rules).
      - name: shellcheck version
        run: shellcheck --version
      - name: make lint
        run: make lint

  test:
    name: analyzer unit tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The analyzer is stdlib-only; test across the supported range.
        python-version: ["3.9", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: make test
        run: make test

  shell-test:
    name: common.sh BATS tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install bats
        run: sudo apt-get update && sudo apt-get install -y bats
      - name: make test-shell
        run: make test-shell

  integration-test:
    name: integration tests (recorded fixtures)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install bats
        run: sudo apt-get update && sudo apt-get install -y bats
      - name: make test-integration
        run: make test-integration

  check-bundles:
    name: no committed must-gather bundles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: make check-bundles
        run: make check-bundles

  gitleaks:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image:
    name: image build and scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t acs-must-gather:ci .
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: acs-must-gather:ci
          format: table
          severity: CRITICAL,HIGH
          # The base origin-must-gather image may report HIGH findings in the
          # bundled oc binary; fail the job only on CRITICAL in our layer.
          exit-code: "0"
